<a id="link" target="_blank" rel="noopener noreferrer" style="display: block; max-width: 450px;">
  <img 
    src="https://raw.githubusercontent.com/fgerinMM/media-host/main/signature.png" 
    alt="Signature" 
    style="width: 100%; height: auto; display: block;"
  />
</a>

<script>
  fetch('https://raw.githubusercontent.com/fgerinMM/media-host/url.txt')
    .then(r => r.text())
    .then(url => { document.getElementById('link').href = url.trim(); });
</script>
